name: build-and-push

# 触发条件: 推送到 main/master 分支, 或打 v* 标签, 或手动触发
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  # 改成你自己的 Docker Hub 用户名/仓库名 (用户名/仓库名 之间用 / 分隔)
  IMAGE: ylgy007/189video

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 用 GitHub Secrets 里的 Docker Hub 凭证登录 (见下方说明)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 用 GitHub Actions 缓存加速重复构建 (pip 层不会每次重装)
          cache-from: type=gha
          cache-to: type=gha,mode=max
