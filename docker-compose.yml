services:
  video-bot:
    image: ylgy007/189video:latest
    container_name: 189video
    restart: unless-stopped

    # ---- 时区 & 密钥 (从同目录 .env 文件读取, 环境变量优先级高于 config.json) ----
    environment:
      TZ: "Asia/Shanghai"
    env_file:
      - .env

    # ---- 数据持久化 + 真实配置覆盖 (config.json 在服务器上, 不进镜像) ----
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json

    # ---- 日志轮转 ----
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
